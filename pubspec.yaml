name: holy_quran
description: A new Flutter project.
publish_to: "none"

version: 1.0.0

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  get: ^4.7.3
  sizer: ^3.1.3
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  persistent_bottom_nav_bar: ^6.2.1
  quran: ^1.3.3
  speech_to_text: ^7.0.0
  google_fonts: ^4.0.5
  scrollable_positioned_list: ^0.3.8

  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Icons_Images/"
    
flutter:
  uses-material-design: true
  assets:
    - assets/Icons_Images/
    - assets/translations/


  fonts:
    - family: InterBold
      fonts:
        - asset: assets/fonts/Inter-Bold.otf
    - family: InterSemibold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.otf
    - family: InterMedium
      fonts:
        - asset: assets/fonts/Inter-Medium.otf
    - family: InterRegular
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
    # Bundled so the Quran renders correctly with no network on first launch.
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700


